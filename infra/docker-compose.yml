services:
  postgres:
    image: postgres:16-alpine
    container_name: floa-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-gps_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  traccar:
    image: traccar/traccar:latest
    container_name: floa-traccar
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      FORWARD_URL: http://api:3001/api/ingest/traccar?token=${TRACCAR_WEBHOOK_SECRET:?Define TRACCAR_WEBHOOK_SECRET en .env}
      EVENT_FORWARD_URL: http://api:3001/api/ingest/traccar?token=${TRACCAR_WEBHOOK_SECRET:?Define TRACCAR_WEBHOOK_SECRET en .env}
    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar_logs:/opt/traccar/logs
    ports:
      # Puerto Cellocator para el CR300B (público)
      - "5033:5033/tcp"
      - "5033:5033/udp"
      # Puerto GT06 opcional
      - "5023:5023/tcp"
      - "5023:5023/udp"
      # Panel web de Traccar (solo accesible en local para administración)
      - "127.0.0.1:8082:8082"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: floa-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-gps_tracker}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      OWNER_MASTER_KEY: ${OWNER_MASTER_KEY:?Define OWNER_MASTER_KEY en .env}
      TRACCAR_WEBHOOK_SECRET: ${TRACCAR_WEBHOOK_SECRET:?Define TRACCAR_WEBHOOK_SECRET en .env}
      TRACCAR_URL: http://traccar:8082
      TRACCAR_USER: ${TRACCAR_ADMIN_USER:-admin}
      TRACCAR_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:?Define TRACCAR_ADMIN_PASSWORD en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Define CORS_ORIGINS en .env}
    ports:
      - "127.0.0.1:3001:3001"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: floa-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

volumes:
  postgres_data:
  traccar_logs:
